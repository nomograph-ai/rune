# gitlab.com/nomograph/rune .gitlab-ci.yml
#
# Pipeline structure provided by nomograph/pipeline tool-rust@v4.1.7.

default:
  tags: [storr]

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - component: gitlab.com/nomograph/pipeline/tool-rust@v4.1.7
    inputs:
      binary_name: rune
      project_description: "Skill registry sync for Claude Code projects."
      crates_publish: true

# Repo-specific lint backstops not covered by the universal gates.
file-size-gate:
  stage: lint
  tags: [storr]
  needs: []
  script:
    - ./scripts/check-file-sizes.sh

shellcheck:
  stage: lint
  tags: [storr]
  image: koalaman/shellcheck-alpine:stable
  needs: []
  script:
    - shellcheck -s bash resources/hook.sh
    - shellcheck -s sh scripts/check-file-sizes.sh

check-symlinks:
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/check-symlinks.sh
